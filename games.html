<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Catalogue des 35 jeux d'Aetherion Studios : RPG, FPS, stratégie, aventure, horreur et bien plus. Filtrez par genre." />
  <meta name="theme-color" content="#06010f" />
  <title>Catalogue — 35 jeux · Aetherion Studios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/pages.css" />
</head>
<body>
  <main class="page">
    <div class="page-head">
      <p class="page-head__tag reveal">Catalogue</p>
      <h1 class="page-head__title reveal" style="--d:.1s">35 jeux. Tous les genres.</h1>
      <p class="page-head__sub reveal" style="--d:.2s">
        Du blockbuster open-world au bijou indé, explorez l'intégralité des mondes
        créés par Aetherion Studios.
      </p>
    </div>

    <div class="catalog-controls">
      <div class="catalog-search reveal">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="gameSearch" placeholder="Rechercher un jeu, un genre…" aria-label="Rechercher" />
      </div>
      <div class="catalog-filters reveal" id="gameFilters" style="--d:.1s"></div>
      <p class="catalog-count"><strong id="gameCount">35</strong> jeu(x) affiché(s)</p>
    </div>

    <div class="games-grid" id="gamesGrid"></div>
  </main>

  <script src="data/team.js"></script>
  <script src="data/games.js"></script>
  <script src="scripts/components.js"></script>
  <script src="scripts/main.js"></script>
  <script src="scripts/catalog.js"></script>
</body>
</html>
