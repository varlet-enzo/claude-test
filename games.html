<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="La carte des 35 pâtisseries de la Maison Bonbon : macarons, tartes, entremets, viennoiseries, chocolats… Filtrez par catégorie." />
  <meta name="theme-color" content="#ff4f9a" />
  <title>La Carte — 35 douceurs · Maison Bonbon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/pages.css" />
</head>
<body>
  <main class="page">
    <div class="page-head">
      <p class="page-head__tag reveal">La Carte</p>
      <h1 class="page-head__title reveal" style="--d:.1s">35 douceurs. Toutes les envies.</h1>
      <p class="page-head__sub reveal" style="--d:.2s">
        Du macaron le plus délicat au gâteau de fête le plus spectaculaire, explorez toute
        la carte de la Maison Bonbon.
      </p>
    </div>

    <div class="catalog-controls">
      <div class="catalog-search reveal">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="gameSearch" placeholder="Rechercher une douceur, une saveur…" aria-label="Rechercher" />
      </div>
      <div class="catalog-filters reveal" id="gameFilters" style="--d:.1s"></div>
      <p class="catalog-count"><strong id="gameCount">35</strong> douceur(s) affichée(s)</p>
    </div>

    <div class="games-grid" id="gamesGrid"></div>
  </main>

  <script src="data/team.js"></script>
  <script src="data/games.js"></script>
  <script src="scripts/components.js"></script>
  <script src="scripts/main.js"></script>
  <script src="scripts/catalog.js"></script>
</body>
</html>
