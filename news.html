<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Actualités de la Maison Bonbon : nouveautés de saison, collections et coulisses de nos ateliers." />
  <meta name="theme-color" content="#ff4f9a" />
  <title>Actualités — Maison Bonbon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/pages.css" />
</head>
<body>
  <main class="page">
    <div class="page-head">
      <p class="page-head__tag reveal">Actualités</p>
      <h1 class="page-head__title reveal" style="--d:.1s">Les douceurs du moment</h1>
      <p class="page-head__sub reveal" style="--d:.2s">Nouveautés de saison, collections et coulisses de nos ateliers.</p>
    </div>
    <div class="news-grid" id="newsGrid"></div>
  </main>

  <script src="data/team.js"></script>
  <script src="scripts/components.js"></script>
  <script src="scripts/main.js"></script>
  <script>
    (() => {
      const grid = document.getElementById("newsGrid");
      if (!grid) return;
      const news = [
        { cat: "Nouveauté", date: "28 mai 2026", hue: 345, title: "La collection Fraisier de printemps", text: "Nos fraises gariguette arrivent en vitrine : fraisier, tartes et verrines à la fraise." },
        { cat: "Collection", date: "14 mai 2026", hue: 300, title: "Macarons édition fleurie", text: "Rose, violette et fleur d'oranger : trois nouvelles coques délicatement parfumées." },
        { cat: "Coulisses", date: "2 mai 2026", hue: 25, title: "Dans l'atelier chocolaterie", text: "Reportage : comment naît notre praliné noisette maison, du grillage au tempérage." },
        { cat: "Événement", date: "20 avr. 2026", hue: 330, title: "Atelier macarons pour enfants", text: "Nos chefs ouvrent les portes du labo pour un atelier gourmand en famille." },
        { cat: "Saison", date: "8 avr. 2026", hue: 50, title: "Le retour de la tarte au citron", text: "Le citron de Menton est de retour : notre tarte meringuée revient en vitrine." },
        { cat: "Maison", date: "1 avr. 2026", hue: 160, title: "Nous recrutons dans six ateliers", text: "La maison grandit : découvrez nos nouvelles offres d'emploi gourmandes." },
      ];
      grid.innerHTML = news.map((n, i) => `
        <article class="news-card reveal" style="--hue:${n.hue};--d:${(i % 3) * 0.08}s" data-cursor data-tilt>
          <div class="news-card__media"><span class="news-card__cat">${n.cat}</span></div>
          <div class="news-card__body">
            <span class="news-card__date">${n.date}</span>
            <h3>${n.title}</h3>
            <p>${n.text}</p>
          </div>
        </article>`).join("");
      window.AETHER && window.AETHER.refresh(grid);
    })();
  </script>
</body>
</html>
