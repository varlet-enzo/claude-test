<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Actualités d'Aetherion Studios : annonces, sorties, mises à jour et coulisses de développement." />
  <meta name="theme-color" content="#06010f" />
  <title>Actualités — Aetherion Studios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/pages.css" />
</head>
<body>
  <main class="page">
    <div class="page-head">
      <p class="page-head__tag reveal">Actualités</p>
      <h1 class="page-head__title reveal" style="--d:.1s">Les dernières nouvelles</h1>
      <p class="page-head__sub reveal" style="--d:.2s">Annonces, sorties et coulisses du studio.</p>
    </div>
    <div class="news-grid" id="newsGrid"></div>
  </main>

  <script src="data/team.js"></script>
  <script src="scripts/components.js"></script>
  <script src="scripts/main.js"></script>
  <script>
    (() => {
      const grid = document.getElementById("newsGrid");
      if (!grid) return;
      const news = [
        { cat: "Annonce", date: "28 mai 2026", hue: 280, title: "Aetherion nommé Game of the Year", text: "Notre RPG open-world figure parmi les finalistes des plus grands prix de l'année." },
        { cat: "Sortie", date: "14 mai 2026", hue: 320, title: "Eclipse Protocol entre en bêta", text: "Le tir tactique coopératif ouvre ses portes à une première vague de testeurs." },
        { cat: "Coulisses", date: "2 mai 2026", hue: 210, title: "Dans les studios audio d'Hollow Echoes", text: "Reportage : comment notre équipe sonore crée la peur par le silence." },
        { cat: "Mise à jour", date: "20 avr. 2026", hue: 190, title: "Celestia : la saison des Cieux Brisés", text: "Nouvelles îles, raids et métiers arrivent dans notre MMORPG aérien." },
        { cat: "Communauté", date: "8 avr. 2026", hue: 140, title: "Le concours de création Skyforge", text: "Les plus belles îles flottantes des joueurs sont récompensées ce mois-ci." },
        { cat: "Studio", date: "1 avr. 2026", hue: 40, title: "Nous recrutons dans six secteurs", text: "Le studio grandit : découvrez nos nouvelles offres d'emploi." },
      ];
      grid.innerHTML = news.map((n, i) => `
        <article class="news-card reveal" style="--hue:${n.hue};--d:${(i % 3) * 0.08}s" data-cursor data-tilt>
          <div class="news-card__media"><span class="news-card__cat">${n.cat}</span></div>
          <div class="news-card__body">
            <span class="news-card__date">${n.date}</span>
            <h3>${n.title}</h3>
            <p>${n.text}</p>
          </div>
        </article>`).join("");
      window.AETHER && window.AETHER.refresh(grid);
    })();
  </script>
</body>
</html>
