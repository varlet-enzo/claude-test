<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Les six ateliers de la Maison Bonbon : pâtisserie, boulangerie, chocolaterie, cake design, production et boutique." />
  <meta name="theme-color" content="#ff4f9a" />
  <title>Nos ateliers — Maison Bonbon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/pages.css" />
</head>
<body>
  <main class="page">
    <div class="page-head">
      <p class="page-head__tag reveal">Nos ateliers</p>
      <h1 class="page-head__title reveal" style="--d:.1s">Six ateliers, une maison</h1>
      <p class="page-head__sub reveal" style="--d:.2s">
        Derrière chaque douceur, des artisans passionnés et complémentaires. Découvrez nos
        métiers et les mains qui les font vivre.
      </p>
    </div>
    <div class="teams-grid" id="teamsGrid"></div>
  </main>

  <script src="data/team.js"></script>
  <script src="scripts/components.js"></script>
  <script src="scripts/main.js"></script>
  <script>
    (() => {
      const grid = document.getElementById("teamsGrid");
      if (!grid || !window.DEPARTMENTS) return;
      grid.innerHTML = window.DEPARTMENT_ORDER.map((slug) => {
        const d = window.DEPARTMENTS[slug];
        return `
        <a class="team-card reveal" href="secteur.html?dept=${d.slug}" data-cursor data-tilt style="--hue:${d.hue}">
          <div class="team-card__icon">${d.icon}</div>
          <h3>${d.name}</h3>
          <p>${d.mission.slice(0, 120)}…</p>
          <span class="team-card__count">${d.profiles.length} artisans · ${d.stack.length} savoir-faire →</span>
        </a>`;
      }).join("");
      window.AETHER && window.AETHER.refresh(grid);
    })();
  </script>
</body>
</html>
