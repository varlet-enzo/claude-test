<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Les six secteurs d'Aetherion Studios : programmation, art, game design, production, audio et QA." />
  <meta name="theme-color" content="#06010f" />
  <title>Nos équipes — Aetherion Studios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/pages.css" />
</head>
<body>
  <main class="page">
    <div class="page-head">
      <p class="page-head__tag reveal">Les équipes</p>
      <h1 class="page-head__title reveal" style="--d:.1s">Six secteurs, un studio</h1>
      <p class="page-head__sub reveal" style="--d:.2s">
        Derrière chaque jeu, des dizaines de talents complémentaires. Découvrez nos métiers
        et les profils qui les font vivre.
      </p>
    </div>
    <div class="teams-grid" id="teamsGrid"></div>
  </main>

  <script src="data/team.js"></script>
  <script src="scripts/components.js"></script>
  <script src="scripts/main.js"></script>
  <script>
    (() => {
      const grid = document.getElementById("teamsGrid");
      if (!grid || !window.DEPARTMENTS) return;
      grid.innerHTML = window.DEPARTMENT_ORDER.map((slug) => {
        const d = window.DEPARTMENTS[slug];
        return `
        <a class="team-card reveal" href="secteur.html?dept=${d.slug}" data-cursor data-tilt style="--hue:${d.hue}">
          <div class="team-card__icon">${d.icon}</div>
          <h3>${d.name}</h3>
          <p>${d.mission.slice(0, 120)}…</p>
          <span class="team-card__count">${d.profiles.length} profils · ${d.stack.length} technos →</span>
        </a>`;
      }).join("");
      window.AETHER && window.AETHER.refresh(grid);
    })();
  </script>
</body>
</html>
